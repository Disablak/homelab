apiVersion: v1
kind: ConfigMap
metadata:
  name: quake3-config
  namespace: quake3
data:
  # Exec'd after the image's common.cfg (via SERVER_ARGS "+exec server.cfg"),
  # so these values override the image defaults.
  server.cfg: |
    // disablak homelab Quake 3 Arena - Free For All
    seta sv_hostname "disablak homelab q3"
    seta sv_maxclients "12"
    seta g_gametype "0"          // 0:FFA 1:Tourney 3:TDM 4:CTF
    seta sv_pure "1"             // clients must match paks (pak0-pak8 present)
    seta g_password ""           // open join, no password
    seta sv_maxRate "25000"
    seta g_allowvote "1"

    // no forced bots; add manually via rcon if desired
    seta bot_enable "1"
    seta bot_minplayers "0"

    // map rotation: q3dm17 -> q3dm6 -> q3dm7 -> repeat
    set d1 "map q3dm17 ; set nextmap vstr d2"
    set d2 "map q3dm6 ; set nextmap vstr d3"
    set d3 "map q3dm7 ; set nextmap vstr d1"
    vstr d1
