apiVersion: v1
kind: ConfigMap
metadata:
  name: cs16-config
  namespace: cs16
data:
  server.cfg: |
    hostname "disablak homelab cs"
    sv_lan 0
    mp_timelimit 20
    mp_friendlyfire 0
    mp_autoteambalance 1
    sv_password ""
    // rcon_password is set from the cs16-rcon secret (written by init container).
    exec addons/rcon.cfg
    // Ban an IP for 60 min after 5 bad rcon attempts within 30s.
    sv_rcon_minfailures 5
    sv_rcon_minfailuretime 30
    sv_rcon_banpenalty 60
  mapcycle.txt: |
    de_dust2
    de_inferno
    de_nuke
    de_train
    cs_office
    fy_pool_day
  # Load metamod instead of cs.so; metamod then loads cs.so + plugins.
  liblist.gam: |
    game "Counter-Strike"
    url_info "www.counter-strike.net"
    url_dl ""
    version "1.6"
    size "184000000"
    svonly "0"
    secure "1"
    type "multiplayer_only"
    cldll "1"
    hlversion "1111"
    nomodels "1"
    nohimodel "1"
    mpentity "info_player_start"
    gamedll "dlls\mp.dll"
    gamedll_linux "addons/metamod/dlls/metamod.so"
    gamedll_osx "dlls/cs.dylib"
    trainmap "tr_1"
    edicts	"1800"
  # Runs in the init container: fetches ReHLDS engine, metamod-p, reunion and
  # podbot into /addons (mounted over cstrike/addons; engine and reunion.cfg
  # are subPath-mounted from it).
  install-addons.sh: |
    set -eu
    cd /tmp
    rand() { head -c 64 /dev/urandom | base64 | tr -dc A-Za-z0-9; }
    wget -q https://github.com/rehlds/ReHLDS/releases/download/3.15.0.896/rehlds-bin-3.15.0.896.zip -O rehlds.zip
    wget -q https://github.com/rehlds/ReUnion/releases/download/0.2.0.34/reunion-0.2.0.34.zip -O reunion.zip
    wget -q https://github.com/Bots-United/metamod-p/releases/download/v1.21p109/metamod-p-v1.21p109-linux_ubuntu1804.tar.xz -O mm.tar.xz
    wget -q https://github.com/APGRoboCop/podbot_mm/releases/download/V3B24-APG/podbot_full_V3B24.zip -O pb.zip
    # Custom map, committed to this repo (cluster/apps/cs16/maps).
    wget -q https://raw.githubusercontent.com/Disablak/homelab/main/cluster/apps/cs16/maps/fy_pool_day.bsp -O fy_pool_day.bsp
    sha256sum -c <<SUM
    997baeb7ef3842dab3e034d82dc651ebfe560c23b158adce660a6b97976b4e2b  rehlds.zip
    29745559cefdcaee78c847d16e3861a8981fb77afc7600a58bb1a8a57dfeb897  reunion.zip
    3b77d804cd5687ee18a8535ec02d085e42c9d0da1c12a0683c6aeb25e88d3e1e  mm.tar.xz
    4cbb2baaa5c6e9120091a7d053f3e8eefefcd06e81236bd8b8e67eaacc18a4c7  pb.zip
    fb22ba78a20d762a7114bdd56d62ec01794695ac48c6777f1bbd676ab769d208  fy_pool_day.bsp
    SUM
    # ReHLDS: drop-in engine replacement, required by reunion.
    mkdir -p /addons/rehlds
    unzip -qoj rehlds.zip bin/linux32/engine_i486.so -d /addons/rehlds
    tar xJf mm.tar.xz            # -> addons/metamod/...
    cp -r addons/metamod /addons/
    unzip -qo reunion.zip 'addons/reunion/*' reunion.cfg
    cp -r addons/reunion /addons/
    unzip -qo pb.zip -d /addons  # -> /addons/podbot/...
    mkdir -p /addons/maps && cp fy_pool_day.bsp /addons/maps/
    # Reunion must load first.
    printf '%s\n' 'linux addons/reunion/reunion_mm_i386.so' 'linux addons/podbot/podbot_mm.so' > /addons/metamod/plugins.ini
    # Let non-Steam clients (Xash3D, protocol 47/48) in with IP-derived IDs.
    # ponytail: salt regenerated each boot, so non-Steam IDs change on restart;
    # move it to a SOPS secret if bans/stats ever key on SteamID.
    sed -e 's/^cid_NoSteam47 = .*/cid_NoSteam47 = 3/' \
      -e 's/^cid_NoSteam48 = .*/cid_NoSteam48 = 3/' \
      -e "s/^SteamIdHashSalt =.*/SteamIdHashSalt = $(rand)/" \
      reunion.cfg > /addons/reunion.cfg
    echo "rcon_password \"$RCON_PASSWORD\"" > /addons/rcon.cfg
    cfg=/addons/podbot/podbot.cfg
    # Always exactly 2 bots (min=max, so joining humans don't kick them).
    sed -i -e '/^pb add /d' \
      -e 's/^pb_minbots .*/pb_minbots 2/' \
      -e 's/^pb_maxbots .*/pb_maxbots 2/' \
      -e 's/^pb_minbotskill .*/pb_minbotskill 40/' \
      -e 's/^pb_maxbotskill .*/pb_maxbotskill 80/' \
      -e "s/^pb_password .*/pb_password \"$(rand)\"/" \
      "$cfg"
    echo 'pb fillserver' >> "$cfg"
