apiVersion: v1
kind: ConfigMap
metadata:
  name: cs16-config
  namespace: cs16
data:
  server.cfg: |
    hostname "disablak homelab cs"
    sv_lan 0
    mp_timelimit 20
    mp_friendlyfire 0
    mp_autoteambalance 1
    sv_password ""
  mapcycle.txt: |
    de_dust2
    de_inferno
    de_nuke
    de_train
    cs_office
  # Load metamod instead of cs.so; metamod then loads cs.so + plugins.
  liblist.gam: |
    game "Counter-Strike"
    url_info "www.counter-strike.net"
    url_dl ""
    version "1.6"
    size "184000000"
    svonly "0"
    secure "1"
    type "multiplayer_only"
    cldll "1"
    hlversion "1111"
    nomodels "1"
    nohimodel "1"
    mpentity "info_player_start"
    gamedll "dlls\mp.dll"
    gamedll_linux "addons/metamod/dlls/metamod.so"
    gamedll_osx "dlls/cs.dylib"
    trainmap "tr_1"
    edicts	"1800"
  # Runs in the init container: fetches metamod-p + podbot into /addons.
  install-addons.sh: |
    set -eu
    cd /tmp
    wget -q https://github.com/Bots-United/metamod-p/releases/download/v1.21p109/metamod-p-v1.21p109-linux_ubuntu1804.tar.xz -O mm.tar.xz
    wget -q https://github.com/APGRoboCop/podbot_mm/releases/download/V3B24-APG/podbot_full_V3B24.zip -O pb.zip
    sha256sum -c <<SUM
    3b77d804cd5687ee18a8535ec02d085e42c9d0da1c12a0683c6aeb25e88d3e1e  mm.tar.xz
    4cbb2baaa5c6e9120091a7d053f3e8eefefcd06e81236bd8b8e67eaacc18a4c7  pb.zip
    SUM
    tar xJf mm.tar.xz            # -> addons/metamod/...
    cp -r addons/metamod /addons/
    unzip -qo pb.zip -d /addons  # -> /addons/podbot/...
    echo 'linux addons/podbot/podbot_mm.so' > /addons/metamod/plugins.ini
    cfg=/addons/podbot/podbot.cfg
    # Keep 10 players total: bots fill empty slots and leave as humans join.
    sed -i -e '/^pb add /d' \
      -e 's/^pb_maxbots .*/pb_maxbots 10/' \
      -e 's/^pb_minbotskill .*/pb_minbotskill 40/' \
      -e 's/^pb_maxbotskill .*/pb_maxbotskill 80/' \
      -e "s/^pb_password .*/pb_password \"$(head -c 18 /dev/urandom | base64)\"/" \
      "$cfg"
    echo 'pb fillserver' >> "$cfg"
