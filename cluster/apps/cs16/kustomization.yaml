apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
generators:
  - secret-generator.yaml
# Name gets a content hash, so any config change rolls the pod.
configMapGenerator:
  - name: cs16-config
    namespace: cs16
    files:
      - config/server.cfg
      - config/mapcycle.txt
      # Loads metamod instead of cs.so; metamod then loads cs.so + plugins.
      - config/liblist.gam
      - config/install-addons.sh
