hostname "disablak homelab cs"
sv_lan 0
mp_timelimit 20
mp_friendlyfire 0
mp_autoteambalance 1
sv_password ""
// rcon_password is set from the cs16-rcon secret (written by init container).
exec addons/rcon.cfg
// Ban an IP for 60 min after 5 bad rcon attempts within 30s.
sv_rcon_minfailures 5
sv_rcon_minfailuretime 30
sv_rcon_banpenalty 60
