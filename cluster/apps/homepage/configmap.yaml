apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Kubernetes:
        style: row
        columns: 4
  kubernetes.yaml: |
    mode: cluster
  services.yaml: |
    []
  bookmarks.yaml: |
    []
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "disablak"
        nodes:
          show: false
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
