apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,home.disablak.xyz"
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-data
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config-data
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config-data
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config-data
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config-data
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config-data
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: config-data
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: config-data
              mountPath: /app/config/custom.js
              subPath: custom.js
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 1Gi
        - name: config-data
          configMap:
            name: homepage-config
