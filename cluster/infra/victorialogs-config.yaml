apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victorialogs-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Disablak/homelab
    targetRevision: main
    path: cluster/infra/victorialogs-config
  destination:
    server: https://kubernetes.default.svc
    namespace: victorialogs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
