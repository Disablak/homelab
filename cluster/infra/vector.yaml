apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.vector.dev
    chart: vector
    targetRevision: 0.57.0
    helm:
      values: |
        role: Agent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        customConfig:
          data_dir: /vector-data-dir
          api:
            enabled: false
          sources:
            kubernetes_logs:
              type: kubernetes_logs
          sinks:
            victorialogs:
              type: elasticsearch
              inputs: ["kubernetes_logs"]
              endpoints:
                - http://victorialogs.victorialogs.svc.cluster.local:9428/insert/elasticsearch/
              api_version: v8
              compression: gzip
              healthcheck:
                enabled: false
              query:
                _msg_field: message
                _time_field: timestamp
                _stream_fields: "kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name"
              request:
                headers:
                  AccountID: "0"
                  ProjectID: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: vector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
