apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Disablak/homelab
    targetRevision: main
    path: cluster
    directory:
      recurse: true
      include: '{argocd.yaml,apps/*.yaml,infra/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
